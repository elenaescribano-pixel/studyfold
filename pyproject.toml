[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyfold"
version = "0.1.0"
description = "Compact study-note PDFs into dense two-column pages and translate them in place, keeping images, colours and code."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]
keywords = ["pdf", "translation", "notion", "study-notes", "pymupdf"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
studyfold = "studyfold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
